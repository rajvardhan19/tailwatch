[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tailwatch"
version = "0.1.0"
description = "Reproducible, evidence-linked acquisition signal research"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<2.1", "alembic>=1.15,<2",
  "defusedxml>=0.7,<1",
]

[project.scripts]
tailwatch = "tailwatch.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-defusedxml>=0.7,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires an explicitly configured test PostgreSQL database"]
