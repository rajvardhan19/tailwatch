name: checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make check test
      - run: uv run --locked tailwatch fixture

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: tailwatch
          POSTGRES_PASSWORD: tailwatch
          POSTGRES_DB: tailwatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tailwatch -d tailwatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TAILWATCH_TEST_DATABASE_URL: postgresql+psycopg://tailwatch:tailwatch@localhost:5432/tailwatch_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.15'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest tests/integration
