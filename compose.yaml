services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: tailwatch
      POSTGRES_PASSWORD: tailwatch
      POSTGRES_DB: tailwatch_test
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tailwatch -d tailwatch_test']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
